name: image-scan

# Build each Docker image from its Dockerfile, scan it for known CVEs with
# grype (anchore/grype) and check layer efficiency with dive (wagoodman/dive).
# Both steps report only for now; the base images (postgres:9.3, alpine:3.9,
# openjdk:11-jre-slim) are old enough that gating would fail every run.

on:
  pull_request:
    paths:
      - 'postgres/**'
      - 'tomcat/**'
      - 'intermine_builder/**'
      - '.dive-ci'
      - '.github/workflows/image-scan.yml'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # solr is not listed: its base image (openjdk:11-jre-slim) has been
        # removed from Docker Hub, so solr/solr.Dockerfile no longer builds.
        # Add it back once the base is replaced.
        include:
          - name: postgres
            context: postgres
            dockerfile: postgres/postgres.Dockerfile
          - name: tomcat
            context: tomcat
            dockerfile: tomcat/tomcat.Dockerfile
          - name: intermine_builder
            context: intermine_builder
            dockerfile: intermine_builder/intermine_builder.Dockerfile
    steps:
      - uses: actions/checkout@v6

      - name: Build image
        run: docker build -t "agr_intermine_${{ matrix.name }}:scan" -f "${{ matrix.dockerfile }}" "${{ matrix.context }}"

      - name: Scan for vulnerabilities (grype)
        id: grype
        uses: anchore/scan-action@v7
        with:
          image: agr_intermine_${{ matrix.name }}:scan
          fail-build: false
          severity-cutoff: high
          output-format: sarif

      - name: Upload grype SARIF
        if: always() && steps.grype.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-${{ matrix.name }}

      - name: Check image efficiency (dive)
        continue-on-error: true
        run: |
          docker run --rm \
            -e CI=true \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.dive-ci:/.dive-ci:ro" \
            wagoodman/dive:v0.13.1 \
            "agr_intermine_${{ matrix.name }}:scan" --ci-config /.dive-ci
