[project]
name = "agr-intermine-builder"
version = "1.0.0"
description = "Compose launcher and operational tools for InterMine builds"
authors = [
    {name = "Alliance of Genome Resources"}
]
requires-python = ">=3.9"
dependencies = [
    "boto3>=1.34.0",
    "psycopg2-binary>=2.9.9",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "hatchling",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "types-requests>=2.31.0",
    "black>=24.1.0",
    "ruff>=0.1.0",
]

[project.scripts]
mine = "src.cli.mine:main"
build-mines = "src.cli.mine:main"
rds-manager = "src.cli.rds_manager:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=src --cov-report=term-missing"
