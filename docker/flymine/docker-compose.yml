services:
  flymine-builder:
    build:
      context: .
      dockerfile: Dockerfile

    image: flymine-builder:${IMAGE_TAG:-latest}
    container_name: flymine-builder

    environment:
      # RDS Connection
      RDS_HOST: ${RDS_HOST}
      RDS_PORT: ${RDS_PORT:-5432}
      RDS_USER: ${RDS_USER:-postgres}
      RDS_PASSWORD: ${RDS_PASSWORD}

      # Build Configuration
      # FlyMine has no FMS-equivalent API; the operator must set FLYMINE_RELEASE
      # (or entrypoint.sh defaults to today's date for a self-describing tag).
      FLYMINE_RELEASE: ${FLYMINE_RELEASE:-}
      BUILD_TYPE: ${BUILD_TYPE:-test}
      # RC_NUMBER: auto-incremented from RDS if not set
      RC_NUMBER: ${RC_NUMBER:-}
      # COPY_PROFILE_DB: if true, test builds get an isolated copy of
      # flymine_userprofile instead of sharing the production one
      COPY_PROFILE_DB: ${COPY_PROFILE_DB:-false}

      # Deployment (optional)
      DEPLOY_HOST: ${DEPLOY_HOST:-}
      DEPLOY_PORT: ${DEPLOY_PORT:-8080}
      DEPLOY_MANAGER: ${DEPLOY_MANAGER:-manager}
      DEPLOY_PASSWORD: ${DEPLOY_PASSWORD:-manager}

      # Webapp
      WEBAPP_BASEURL: ${WEBAPP_BASEURL:-http://localhost:8080}
      SUPERUSER_ACCOUNT: ${SUPERUSER_ACCOUNT:-superuser@mail_account}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD:-secret}

      # BlueGenes tool location (referenced by webapp/build.gradle :blueGenesStart)
      BLUEGENES_TOOL_LOCATION: ${BLUEGENES_TOOL_LOCATION:-/root/bluegenes-tools/node_modules}

      # Java/Gradle (must exceed 48g JVM by ~8G for native memory; container limit is 56G)
      GRADLE_OPTS: >-
        -Xmx48g -Xms24g
        -XX:+UseParallelGC
        -Dorg.gradle.daemon=false

    volumes:
      # FlyMine source dirs come from the operator's local fork — NOT an in-image clone.
      # On AllianceMineDev: rsync /Users/nuin/Projects/alliance/new_flymine/{flymine,flymine-bio-sources}
      # to /home/ec2-user/flymine + /home/ec2-user/flymine-bio-sources, then point these at them.
      # See docs/FLYMINE_DOCKER_HANDOFF_REPLIES_2026_05_30.md Q2.
      - ${FLYMINE_SRC_DIR:?Set FLYMINE_SRC_DIR in .env}:/root/flymine
      - ${FLYMINE_BIO_SOURCES_SRC_DIR:?Set FLYMINE_BIO_SOURCES_SRC_DIR in .env}:/root/flymine-bio-sources
      - ./data:/root/data
      # Persist the maven local repo between runs so bio-sources installs stick
      - flymine-m2:/root/.m2
      - flymine-gradle:/root/.gradle

    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 56G
        reservations:
          cpus: '4'
          memory: 24G

    stdin_open: true
    tty: true

volumes:
  flymine-m2:
  flymine-gradle:
