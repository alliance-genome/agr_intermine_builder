services:
  chado-pg:
    # Local FlyBase Chado Postgres so the chado-db-flybase-dmel source has a
    # backing DB without consuming intermine-postgres RDS storage. Dump
    # restore: `gunzip -c FB2026_01.sql.gz | docker compose exec -T chado-pg psql -U chado -d chado`
    image: postgres:14
    container_name: chado-pg
    environment:
      POSTGRES_USER: ${CHADO_PG_USER:-chado}
      POSTGRES_PASSWORD: ${CHADO_PG_PASSWORD:-chado}
      POSTGRES_DB: ${CHADO_PG_DB:-chado}
    volumes:
      - chado-pg-data:/var/lib/postgresql/data
      # Tuning conf — restore + integrate are both heavy on shared_buffers
      - ./chado-pg.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    networks:
      - chado-net
    # Docker's default /dev/shm is 64 MB; postgres needs much more for parallel
    # workers + hash joins on the big chado tables (feature: 25 GB, featureloc:
    # 39 GB). Without this VACUUM and the InterMine chado-db source's parallel
    # queries fail with "could not resize shared memory segment ... No space left
    # on device".
    shm_size: 4gb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CHADO_PG_USER:-chado} -d ${CHADO_PG_DB:-chado}"]
      interval: 10s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 12G

  flymine-builder:
    build:
      context: .
      dockerfile: Dockerfile

    image: flymine-builder:${IMAGE_TAG:-latest}
    container_name: flymine-builder

    networks:
      - chado-net
      - default

    environment:
      # RDS Connection (production / userprofile / items DBs)
      RDS_HOST: ${RDS_HOST}
      RDS_PORT: ${RDS_PORT:-5432}
      RDS_USER: ${RDS_USER:-postgres}
      RDS_PASSWORD: ${RDS_PASSWORD}

      # FlyBase Chado source DB — defaults to the local chado-pg service.
      # Override CHADO_PG_HOST in .env to point at an external chado pg.
      CHADO_PG_HOST: ${CHADO_PG_HOST:-chado-pg}
      CHADO_PG_PORT: ${CHADO_PG_PORT:-5432}
      CHADO_PG_DB: ${CHADO_PG_DB:-chado}
      CHADO_PG_USER: ${CHADO_PG_USER:-chado}
      CHADO_PG_PASSWORD: ${CHADO_PG_PASSWORD:-chado}

      # Build Configuration
      # FlyMine has no FMS-equivalent API; the operator must set FLYMINE_RELEASE
      # (or entrypoint.sh defaults to today's date for a self-describing tag).
      FLYMINE_RELEASE: ${FLYMINE_RELEASE:-}
      BUILD_TYPE: ${BUILD_TYPE:-test}
      # RC_NUMBER: auto-incremented from RDS if not set
      RC_NUMBER: ${RC_NUMBER:-}
      # COPY_PROFILE_DB: if true, test builds get an isolated copy of
      # flymine_userprofile instead of sharing the production one
      COPY_PROFILE_DB: ${COPY_PROFILE_DB:-false}

      # Deployment (optional)
      DEPLOY_HOST: ${DEPLOY_HOST:-}
      DEPLOY_PORT: ${DEPLOY_PORT:-8080}
      DEPLOY_MANAGER: ${DEPLOY_MANAGER:-manager}
      DEPLOY_PASSWORD: ${DEPLOY_PASSWORD:-manager}

      # Webapp
      WEBAPP_BASEURL: ${WEBAPP_BASEURL:-http://localhost:8080}
      SUPERUSER_ACCOUNT: ${SUPERUSER_ACCOUNT:-superuser@mail_account}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD:-secret}

      # BlueGenes tool location (referenced by webapp/build.gradle :blueGenesStart)
      BLUEGENES_TOOL_LOCATION: ${BLUEGENES_TOOL_LOCATION:-/root/bluegenes-tools/node_modules}

      # Java/Gradle (must exceed 48g JVM by ~8G for native memory; container limit is 56G)
      GRADLE_OPTS: >-
        -Xmx48g -Xms24g
        -XX:+UseParallelGC
        -Dorg.gradle.daemon=false

    volumes:
      # Data dir is bind-mounted so extract_data.py output is visible to the host.
      - ./data:/root/data
      # Persist the maven local repo + gradle cache between runs so the
      # bio-sources install (~2 min warm) survives container recreation.
      - flymine-m2:/root/.m2
      - flymine-gradle:/root/.gradle

    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 56G
        reservations:
          cpus: '4'
          memory: 24G

    stdin_open: true
    tty: true

volumes:
  flymine-m2:
  flymine-gradle:
  chado-pg-data:

networks:
  chado-net:
  default:
