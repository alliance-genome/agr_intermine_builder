# Postgres tuning for FlyBase Chado dump restore + chado-db source reads.
# Box: AllianceMineDev (~250 GB RAM, lots of cores).
# Container memory limit: 12 GB — keep these within that.
listen_addresses = '*'
max_connections = 50
shared_buffers = 4GB
effective_cache_size = 8GB
work_mem = 64MB
maintenance_work_mem = 1GB
wal_level = minimal
max_wal_senders = 0
checkpoint_completion_target = 0.9
random_page_cost = 1.1
fsync = on
synchronous_commit = off       # speed up restore; chado-db reads are read-only
full_page_writes = on
log_destination = 'stderr'
log_min_duration_statement = 5000
log_line_prefix = '[%t] %u@%d '
