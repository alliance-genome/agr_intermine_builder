services:
  wormmine-builder:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WORMMINE_BRANCH: ${WORMMINE_BRANCH:-im-298}
        WORMMINE_BIO_SOURCES_BRANCH: ${WORMMINE_BIO_SOURCES_BRANCH:-im-293}

    image: wormmine-builder:${IMAGE_TAG:-latest}
    container_name: wormmine-builder

    environment:
      # RDS Connection
      RDS_HOST: ${RDS_HOST}
      RDS_PORT: ${RDS_PORT:-5432}
      RDS_USER: ${RDS_USER:-postgres}
      RDS_PASSWORD: ${RDS_PASSWORD}

      # Build Configuration
      # WormBase release version drives DB naming. WormBase publishes WS-prefixed
      # releases (WS298, WS299, ...). Operator should set this explicitly;
      # entrypoint defaults to today's date if unset.
      WORMBASE_RELEASE: ${WORMBASE_RELEASE:-}
      BUILD_TYPE: ${BUILD_TYPE:-test}
      # RC_NUMBER: auto-incremented from RDS if not set
      RC_NUMBER: ${RC_NUMBER:-}
      # COPY_PROFILE_DB: if true, test builds get an isolated copy of
      # wormmine_userprofile instead of sharing the production one
      COPY_PROFILE_DB: ${COPY_PROFILE_DB:-false}

      # Deployment (optional — WAR is deployed externally to multitenant Tomcat)
      DEPLOY_HOST: ${DEPLOY_HOST:-}
      DEPLOY_PORT: ${DEPLOY_PORT:-8080}
      DEPLOY_MANAGER: ${DEPLOY_MANAGER:-manager}
      DEPLOY_PASSWORD: ${DEPLOY_PASSWORD:-manager}

      # Webapp
      WEBAPP_BASEURL: ${WEBAPP_BASEURL:-http://localhost:8080}
      SUPERUSER_ACCOUNT: ${SUPERUSER_ACCOUNT:-superuser@mail_account}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD:-secret}

      # Java/Gradle (must exceed 48g JVM by ~8G for native memory; container limit 56G)
      GRADLE_OPTS: >-
        -Xmx48g -Xms24g
        -XX:+UseParallelGC
        -Dorg.gradle.daemon=false

    volumes:
      - ./data:/root/data

    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 56G
        reservations:
          cpus: '4'
          memory: 24G

    stdin_open: true
    tty: true
