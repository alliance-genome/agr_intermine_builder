version: '3.8'

# ============================================
# AllianceMine Unified Docker Compose
# ============================================
# Simple single-container deployment with RDS
#
# Usage:
#   docker-compose up -d        # Start in background
#   docker-compose logs -f      # Follow logs
#   docker-compose exec alliancemine bash  # Shell access
#   docker-compose down         # Stop and remove
# ============================================

services:
  alliancemine:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ALLIANCEMINE_BRANCH: ${ALLIANCEMINE_BRANCH:-master}
        BIO_SOURCES_BRANCH: ${BIO_SOURCES_BRANCH:-master}
        ALLIANCE_RELEASE: ${ALLIANCE_RELEASE:-8.2.0}

    image: alliancemine-unified:${IMAGE_TAG:-latest}

    container_name: alliancemine

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 32G
        reservations:
          cpus: '4'
          memory: 16G

    # Ports
    ports:
      - "${TOMCAT_PORT:-8080}:8080"  # Tomcat webapp
      - "${SOLR_PORT:-8983}:8983"    # Solr search

    # Environment variables
    environment:
      # RDS Connection
      RDS_HOST: ${RDS_HOST:-intermine-postgres.cmnnhlso7wdi.us-east-1.rds.amazonaws.com}
      RDS_PORT: ${RDS_PORT:-5432}
      RDS_USER: ${RDS_USER:-postgres}
      RDS_PASSWORD: ${RDS_PASSWORD}
      RDS_DB_NAME: ${RDS_DB_NAME:-alliancemine_db}
      RDS_PROFILE_DB_NAME: ${RDS_PROFILE_DB_NAME:-alliancemine_profiles_db}

      # Application
      ALLIANCE_RELEASE: ${ALLIANCE_RELEASE:-8.2.0}
      AUTO_BUILD: ${AUTO_BUILD:-false}

      # Java Memory Settings
      CATALINA_OPTS: "-Xmx16g -Xms8g -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
      SOLR_JAVA_MEM: "-Xmx4g -Xms2g"

      # Ports (if custom)
      TOMCAT_PORT: ${TOMCAT_PORT:-8080}
      SOLR_PORT: ${SOLR_PORT:-8983}

    # Volumes for data persistence
    volumes:
      # Data directory for builds
      - alliancemine-data:/opt/intermine/data

      # Solr indexes
      - solr-data:/var/solr/data

      # Logs
      - alliancemine-logs:/opt/intermine/logs
      - tomcat-logs:/opt/tomcat/logs

      # Optional: Mount local data sources
      # - ./data:/opt/intermine/data:ro

    # Networking
    networks:
      - intermine-net

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/alliancemine/service/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

    # Restart policy
    restart: unless-stopped

    # Command (default: run)
    # Override with: docker-compose run alliancemine build
    command: run

# ============================================
# Named Volumes
# ============================================
volumes:
  alliancemine-data:
    name: alliancemine_data

  solr-data:
    name: alliancemine_solr

  alliancemine-logs:
    name: alliancemine_logs

  tomcat-logs:
    name: alliancemine_tomcat_logs

# ============================================
# Networks
# ============================================
networks:
  intermine-net:
    name: intermine_network
    driver: bridge
