services:
  alliancemine-builder:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ALLIANCEMINE_BRANCH: ${ALLIANCEMINE_BRANCH:-master}
        BIO_SOURCES_BRANCH: ${BIO_SOURCES_BRANCH:-master}

    image: alliancemine-builder:${IMAGE_TAG:-latest}
    container_name: alliancemine-builder

    environment:
      # RDS Connection
      RDS_HOST: ${RDS_HOST}
      RDS_PORT: ${RDS_PORT:-5432}
      RDS_USER: ${RDS_USER:-postgres}
      RDS_PASSWORD: ${RDS_PASSWORD}

      # Build Configuration
      # ALLIANCE_RELEASE: auto-fetched from FMS API if not set
      ALLIANCE_RELEASE: ${ALLIANCE_RELEASE:-}
      FMS_RELEASE_TYPE: ${FMS_RELEASE_TYPE:-next}
      BUILD_TYPE: ${BUILD_TYPE:-test}
      # RC_NUMBER: auto-incremented from RDS if not set
      RC_NUMBER: ${RC_NUMBER:-}
      # Profile DB (alliancemine_userprofile) is persistent and shared across
      # releases; the build never creates or copies it (see entrypoint.sh).

      # Deployment (optional)
      DEPLOY_HOST: ${DEPLOY_HOST:-}
      DEPLOY_PORT: ${DEPLOY_PORT:-8080}
      DEPLOY_MANAGER: ${DEPLOY_MANAGER:-manager}
      DEPLOY_PASSWORD: ${DEPLOY_PASSWORD:-manager}

      # Webapp
      WEBAPP_BASEURL: ${WEBAPP_BASEURL:-http://localhost:8080}
      SUPERUSER_ACCOUNT: ${SUPERUSER_ACCOUNT:-superuser@mail_account}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD:-secret}

      # SGD Database (external, read-only)
      SGD_DB_HOST: ${SGD_DB_HOST:-}
      SGD_DB_NAME: ${SGD_DB_NAME:-sgd}
      SGD_DB_USER: ${SGD_DB_USER:-}
      SGD_DB_PASSWORD: ${SGD_DB_PASSWORD:-}
      SGD_DB_PORT: ${SGD_DB_PORT:-5432}

      # Solr (external, on EC2). Host + port feed the preflight that creates
      # versioned cores; URLs are auto-derived from release+RC if not overridden.
      SOLR_HOST: ${SOLR_HOST:-172.31.59.87}
      SOLR_PORT: ${SOLR_PORT:-8983}
      SOLR_SSH_KEY: ${SOLR_SSH_KEY:-}
      SOLR_INDEX_URL: ${SOLR_INDEX_URL:-}
      SOLR_AUTOCOMPLETE_URL: ${SOLR_AUTOCOMPLETE_URL:-}

      # Java/Gradle
      GRADLE_OPTS: >-
        -Xmx48g -Xms24g
        -XX:+UseParallelGC
        -Dorg.gradle.daemon=false

    volumes:
      - ./data:/root/data
      # SSH keys for the Solr core preflight. Inside AWS the host's default
      # ec2-user keys already work against multitenant; from outside AWS the
      # operator sets SOLR_SSH_KEY=/root/.ssh/AGR-ssl3.pem in .env.
      - ${SSH_DIR:-~/.ssh}:/root/.ssh:ro

    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 56G
        reservations:
          cpus: '4'
          memory: 24G

    stdin_open: true
    tty: true
