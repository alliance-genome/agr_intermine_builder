version: "3"
services:
  intermine_builder:
    container_name: intermine_builder
    image: intermine/builder:latest
    user: ${UID:-1000}:${GID:-1000}
    volumes:
      # - ./data/mine/data:/home/intermine/intermine/data
      - ./data/mine/dump:/home/intermine/intermine/dump
      - ./data/mine/configs:/home/intermine/intermine/configs
      # - ./data/mine/[PUT_YOUR_MINE_NAME_HERE]:/home/intermine/intermine/[PUT_YOUR_MINE_NAME_HERE]
      - ./data/mine/biotestmine:/home/intermine/intermine/biotestmine
    environment:
      - MINE_NAME=${MINE_NAME:-biotestmine}
      - MINE_REPO_URL=${MINE_REPO_URL:-}
      - BIOSOURCES_REPO_URL=${BIOSOURCE_REPO_URL:-}
      - IM_DATA_DIR=${IM_DATA_DIR:-DATA_DIR}
      - MEM_OPTS=${MEM_OPTS:-"-Xmx2g -Xms1g"}
      - IM_REPO_URL=${IM_REPO_URL:-}
      - IM_REPO_BRANCH=${IM_REPO_BRANCH:-}
    depends_on: 
      postgres:
        condition: service_healthy
      solr:
        condition: service_healthy
      tomcat:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 3g

  postgres:
    container_name: intermine_postgres
    image: intermine/postgres:latest
    user: ${UID:-1000}:${GID:-1000}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g

  solr:
    container_name: intermine_solr
    image: intermine/solr
    environment:
      - MEM_OPTS=${MEM_OPTS:-"-Xmx2g -Xms1g"}
      - MINE_NAME=${MINE_NAME:-biotestmine}
    user: ${UID:-1000}:${GID:-1000}
    volumes:
      - ./data/solr:/var/solr
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8983/solr"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2.5g

  tomcat:
    container_name: intermine_tomcat
    image: intermine/tomcat
    environment:
      - MEM_OPTS=${MEM_OPTS:-"-Xmx1g -Xms500m"}
    ports:
      - ${TOMCAT_HOST_PORT:-9999}:${TOMCAT_PORT:-8080}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1.5g

volumes:
  PostgresDBData:
  SolrDBData:
  MineData:
  MineConfigs:
