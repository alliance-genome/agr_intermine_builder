version: '3.8'

# Multi-tenant InterMine deployment
# Designed for c7i.4xlarge (16 vCPUs, 32GB RAM)
#
# Services:
#   - Solr: Single instance with multiple cores (one per mine)
#   - Tomcat: Multiple containers (one per mine)
#   - BlueGenes: Single instance serving all mines
#   - Nginx: Reverse proxy for all services
#
# Memory allocation:
#   - Each Tomcat: 2-2.5 GB
#   - Solr: 2-3 GB
#   - BlueGenes: 1 GB
#   - Nginx: minimal
#   - System: ~4 GB reserved

networks:
  intermine:
    driver: bridge

volumes:
  solr_data:
  nginx_cache:
  cdn_data:

services:
  # Shared Solr instance with multiple cores
  solr:
    image: solr:8.11
    container_name: intermine-solr
    networks:
      - intermine
    ports:
      - "8983:8983"
    volumes:
      - solr_data:/var/solr
      - ./solr-config:/opt/solr-config:ro
    environment:
      - SOLR_HEAP=2g
      - SOLR_JAVA_MEM=-Xms2g -Xmx2g
      - GC_TUNE=-XX:+UseG1GC
    command:
      - solr-precreate
      - alliancemine
    deploy:
      resources:
        limits:
          memory: 3g
          cpus: '2'
        reservations:
          memory: 2g
          cpus: '1'
    restart: unless-stopped

  # AllianceMine
  alliancemine:
    image: 100225593120.dkr.ecr.us-east-1.amazonaws.com/agr_alliancemine:latest
    container_name: alliancemine-tomcat
    networks:
      - intermine
    ports:
      - "9001:8080"
    environment:
      - MINE_NAME=alliancemine
      - CATALINA_OPTS=-Xmx2g -Xms2g -XX:+UseG1GC -XX:MaxGCPauseMillis=200
      - RDS_HOST=${RDS_HOST}
      - RDS_PORT=${RDS_PORT}
      - RDS_USER=${RDS_USER}
      - RDS_PASSWORD=${RDS_PASSWORD}
      - SOLR_URL=http://solr:8983/solr/alliancemine
    volumes:
      - /data/mines/alliancemine:/data
    deploy:
      resources:
        limits:
          memory: 2500m
          cpus: '2'
        reservations:
          memory: 2g
          cpus: '1'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/alliancemine/service/version"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: always
    depends_on:
      - solr

  # WormMine
  wormmine:
    image: 100225593120.dkr.ecr.us-east-1.amazonaws.com/agr_wormmine:latest
    container_name: wormmine-tomcat
    networks:
      - intermine
    ports:
      - "9002:8080"
    environment:
      - MINE_NAME=wormmine
      - CATALINA_OPTS=-Xmx2g -Xms2g -XX:+UseG1GC -XX:MaxGCPauseMillis=200
      - RDS_HOST=${RDS_HOST}
      - RDS_PORT=${RDS_PORT}
      - RDS_USER=${RDS_USER}
      - RDS_PASSWORD=${RDS_PASSWORD}
      - SOLR_URL=http://solr:8983/solr/wormmine
    volumes:
      - /data/mines/wormmine:/data
    deploy:
      resources:
        limits:
          memory: 2500m
          cpus: '2'
        reservations:
          memory: 2g
          cpus: '1'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/wormmine/service/version"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: always
    depends_on:
      - solr

  # FlyMine (example - replicate for additional mines)
  flymine:
    image: 100225593120.dkr.ecr.us-east-1.amazonaws.com/agr_flymine:latest
    container_name: flymine-tomcat
    networks:
      - intermine
    ports:
      - "9003:8080"
    environment:
      - MINE_NAME=flymine
      - CATALINA_OPTS=-Xmx2g -Xms2g -XX:+UseG1GC -XX:MaxGCPauseMillis=200
      - RDS_HOST=${RDS_HOST}
      - RDS_PORT=${RDS_PORT}
      - RDS_USER=${RDS_USER}
      - RDS_PASSWORD=${RDS_PASSWORD}
      - SOLR_URL=http://solr:8983/solr/flymine
    volumes:
      - /data/mines/flymine:/data
    deploy:
      resources:
        limits:
          memory: 2500m
          cpus: '2'
        reservations:
          memory: 2g
          cpus: '1'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/flymine/service/version"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: always
    depends_on:
      - solr

  # ZebrafishMine
  zebrafishmine:
    image: 100225593120.dkr.ecr.us-east-1.amazonaws.com/agr_zebrafishmine:latest
    container_name: zebrafishmine-tomcat
    networks:
      - intermine
    ports:
      - "9004:8080"
    environment:
      - MINE_NAME=zebrafishmine
      - CATALINA_OPTS=-Xmx2g -Xms2g -XX:+UseG1GC -XX:MaxGCPauseMillis=200
      - RDS_HOST=${RDS_HOST}
      - RDS_PORT=${RDS_PORT}
      - RDS_USER=${RDS_USER}
      - RDS_PASSWORD=${RDS_PASSWORD}
      - SOLR_URL=http://solr:8983/solr/zebrafishmine
    volumes:
      - /data/mines/zebrafishmine:/data
    deploy:
      resources:
        limits:
          memory: 2500m
          cpus: '2'
        reservations:
          memory: 2g
          cpus: '1'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/zebrafishmine/service/version"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: always
    depends_on:
      - solr

  # MouseMine
  mousemine:
    image: 100225593120.dkr.ecr.us-east-1.amazonaws.com/agr_mousemine:latest
    container_name: mousemine-tomcat
    networks:
      - intermine
    ports:
      - "9005:8080"
    environment:
      - MINE_NAME=mousemine
      - CATALINA_OPTS=-Xmx2g -Xms2g -XX:+UseG1GC -XX:MaxGCPauseMillis=200
      - RDS_HOST=${RDS_HOST}
      - RDS_PORT=${RDS_PORT}
      - RDS_USER=${RDS_USER}
      - RDS_PASSWORD=${RDS_PASSWORD}
      - SOLR_URL=http://solr:8983/solr/mousemine
    volumes:
      - /data/mines/mousemine:/data
    deploy:
      resources:
        limits:
          memory: 2500m
          cpus: '2'
        reservations:
          memory: 2g
          cpus: '1'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/mousemine/service/version"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: always
    depends_on:
      - solr

  # RatMine
  ratmine:
    image: 100225593120.dkr.ecr.us-east-1.amazonaws.com/agr_ratmine:latest
    container_name: ratmine-tomcat
    networks:
      - intermine
    ports:
      - "9006:8080"
    environment:
      - MINE_NAME=ratmine
      - CATALINA_OPTS=-Xmx2g -Xms2g -XX:+UseG1GC -XX:MaxGCPauseMillis=200
      - RDS_HOST=${RDS_HOST}
      - RDS_PORT=${RDS_PORT}
      - RDS_USER=${RDS_USER}
      - RDS_PASSWORD=${RDS_PASSWORD}
      - SOLR_URL=http://solr:8983/solr/ratmine
    volumes:
      - /data/mines/ratmine:/data
    deploy:
      resources:
        limits:
          memory: 2500m
          cpus: '2'
        reservations:
          memory: 2g
          cpus: '1'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ratmine/service/version"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: always
    depends_on:
      - solr

  # BlueGenes - Single instance for all mines
  bluegenes:
    image: intermine/bluegenes:latest
    container_name: bluegenes
    networks:
      - intermine
    ports:
      - "5000:5000"
    environment:
      - SERVER_PORT=5000
      - GOOGLE_ANALYTICS=
    volumes:
      - ./bluegenes-config.edn:/config/config.edn:ro
    deploy:
      resources:
        limits:
          memory: 1500m
          cpus: '1'
        reservations:
          memory: 1g
          cpus: '0.5'
    restart: unless-stopped
    depends_on:
      - alliancemine
      - wormmine
      - flymine
      - zebrafishmine
      - mousemine
      - ratmine

  # Nginx reverse proxy + CDN
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    networks:
      - intermine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
      - cdn_data:/var/www/cdn
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
    restart: unless-stopped
    depends_on:
      - bluegenes
      - alliancemine
      - wormmine
      - flymine
      - zebrafishmine
      - mousemine
      - ratmine
