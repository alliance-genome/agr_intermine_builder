user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # Cache configuration
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=intermine_cache:10m
                     max_size=1g inactive=60m use_temp_path=off;

    # Upstream definitions
    upstream bluegenes {
        server bluegenes:5000;
    }

    upstream alliancemine {
        server alliancemine-tomcat:8080;
    }

    upstream wormmine {
        server wormmine-tomcat:8080;
    }

    upstream flymine {
        server flymine-tomcat:8080;
    }

    upstream zebrafishmine {
        server zebrafishmine-tomcat:8080;
    }

    upstream mousemine {
        server mousemine-tomcat:8080;
    }

    upstream ratmine {
        server ratmine-tomcat:8080;
    }

    upstream solr {
        server solr:8983;
    }

    # HTTP server - redirect to HTTPS
    server {
        listen 80;
        server_name _;

        # Allow Let's Encrypt challenges
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        server_name _;

        # SSL configuration (update with your certificates)
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # BlueGenes (main interface)
        location / {
            proxy_pass http://bluegenes;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # AllianceMine
        location /alliancemine {
            proxy_pass http://alliancemine/alliancemine;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_buffering on;
            proxy_cache intermine_cache;
            proxy_cache_valid 200 10m;
            proxy_cache_bypass $http_cache_control;
        }

        # WormMine
        location /wormmine {
            proxy_pass http://wormmine/wormmine;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_buffering on;
            proxy_cache intermine_cache;
            proxy_cache_valid 200 10m;
            proxy_cache_bypass $http_cache_control;
        }

        # FlyMine
        location /flymine {
            proxy_pass http://flymine/flymine;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_buffering on;
            proxy_cache intermine_cache;
            proxy_cache_valid 200 10m;
            proxy_cache_bypass $http_cache_control;
        }

        # ZebrafishMine
        location /zebrafishmine {
            proxy_pass http://zebrafishmine/zebrafishmine;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_buffering on;
            proxy_cache intermine_cache;
            proxy_cache_valid 200 10m;
            proxy_cache_bypass $http_cache_control;
        }

        # MouseMine
        location /mousemine {
            proxy_pass http://mousemine/mousemine;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_buffering on;
            proxy_cache intermine_cache;
            proxy_cache_valid 200 10m;
            proxy_cache_bypass $http_cache_control;
        }

        # RatMine
        location /ratmine {
            proxy_pass http://ratmine/ratmine;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_buffering on;
            proxy_cache intermine_cache;
            proxy_cache_valid 200 10m;
            proxy_cache_bypass $http_cache_control;
        }

        # Solr (admin access only - restrict by IP if needed)
        location /solr {
            # Uncomment to restrict access
            # allow 10.0.0.0/8;
            # deny all;

            proxy_pass http://solr;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Status page (restrict by IP)
        location /nginx_status {
            stub_status on;
            access_log off;
            # allow 127.0.0.1;
            # deny all;
        }
    }
}
